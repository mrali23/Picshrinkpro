<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#2F6BFF" />
    <!-- Per-page title, description, canonical, Open Graph, Twitter and JSON-LD are injected at build time
         (scripts/prerender.mjs) and kept in sync at runtime by react-helmet-async (SEOHead). -->

    <!-- Preconnect / dns-prefetch for critical third-party origins -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://pagead2.googlesyndication.com" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://cdn.cookiehub.eu" />

    <!-- Cookie consent - deferred, non-blocking -->
    <script src="https://cdn.cookiehub.eu/c2/9ad8b98f.js" defer></script>
    <script type="text/javascript" defer>
      document.addEventListener("DOMContentLoaded", function () {
        if (window.cookiehub) window.cookiehub.load({});
      });
    </script>

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6886959121283165"
      crossorigin="anonymous"></script>

    <!-- Ahrefs Web Analytics -->
    <script src="https://analytics.ahrefs.com/analytics.js" data-key="rz6iLvSCak6xN+IoaDuDlg" async></script>

    <!-- Google tag (gtag.js) - async + delayed config so it does not compete with LCP -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TP5X9WE2N2"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.addEventListener('load', function() {
        gtag('js', new Date());
        gtag('config', 'G-TP5X9WE2N2', { transport_type: 'beacon' });
      });
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
