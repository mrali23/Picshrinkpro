<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#2F6BFF" />
    <script>
      // Paint the saved theme (brand color, corners, dark mode) before React loads, to avoid a flash.
      try {
        var t = JSON.parse(localStorage.getItem('picshrink_theme_cache_' + (location.pathname.indexOf('/admin') === 0 ? 'admin' : 'public')) || 'null');
        if (t) {
          var r = document.documentElement;
          for (var k in t.vars) r.style.setProperty(k, t.vars[k]);
          if (t.scale) r.style.setProperty('--radius-scale', t.scale);
          r.setAttribute('data-theme', t.dark ? 'dark' : 'light');
        }
      } catch (e) {}
    </script>
    <!-- Per-page title, description, canonical, Open Graph, Twitter and JSON-LD are injected at build time
         (scripts/prerender.mjs) and kept in sync at runtime by react-helmet-async (SEOHead). -->

    <!-- Preconnect / dns-prefetch for critical third-party origins -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://pagead2.googlesyndication.com" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://cdn.cookiehub.eu" />

    <!--
      CookieHub must execute synchronously before any tracking or advertising tag.
      Keep this at the top of <head>; do not add async/defer or move it below tags.
    -->
    <script data-cfasync="false" src="https://cdn.cookiehub.eu/c2/9ad8b98f.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        if (window.cookiehub) window.cookiehub.load({});
      });
    </script>

    <!-- Ahrefs is not a Google Consent Mode tag; require explicit analytics consent. -->
    <script
      type="text/plain"
      data-consent="analytics"
      data-src="https://analytics.ahrefs.com/analytics.js"
      data-key="rz6iLvSCak6xN+IoaDuDlg"
    ></script>
    <script>
      // Keep third-party tracking off the admin area (it would skew stats and trigger ad/remarketing requests).
      if (location.pathname.indexOf('/admin') === 0) {
        var ahrefs = document.querySelector('script[data-consent="analytics"]');
        if (ahrefs) ahrefs.remove();
      }
    </script>

    <!--
      Google tags are placed after CookieHub so its configured automatic blocker /
      Consent Mode integration can initialize before these resources execute.
      AdSense is loaded by AdBanner only when ads are enabled in Site Settings.
    -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TP5X9WE2N2"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.addEventListener('load', function() {
        if (location.pathname.indexOf('/admin') === 0) return;
        gtag('js', new Date());
        gtag('config', 'G-TP5X9WE2N2', { transport_type: 'beacon' });
      });
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
